name: CI — qualidade e triagem SOC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Shell, Python, links e relatório
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ShellCheck (erros)
        run: shellcheck --severity=error scripts/*.sh

      - name: Sintaxe Python
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Testes unitários e de integração
        run: python3 -m unittest discover -s tests -v

      - name: Validar links do README e docs
        run: python3 scripts/07-validar-links.py

      - name: Gerar relatório de triagem SOC
        run: python3 scripts/06-soc-triage.py --source evidencias --out reports

      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v5
        with:
          name: soc-triage-report
          path: reports/
          if-no-files-found: error
