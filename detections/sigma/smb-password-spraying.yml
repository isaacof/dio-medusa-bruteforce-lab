title: Password spraying em SMB
id: 9a4e7c10-2d6b-4a55-8f02-smbspray0001
status: experimental
description: Detecta muitas falhas de logon distribuídas entre usuários do mesmo IP.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Isaac Silva
date: 2026-11-09
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 10m
  condition: selection | count() by IpAddress > 10
fields:
  - IpAddress
  - TargetUserName
  - WorkstationName
falsepositives:
  - Contas de serviço com senha desatualizada
  - Usuários com teclado/configuração incorreta
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
